name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install pandas scikit-learn pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"
      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Outils de qualité (TP4)
        run: . .venv/bin/activate && pip install -r requirements-dev.txt
      - name: ruff
        run: . .venv/bin/activate && ruff check .
      - name: mypy
        run: . .venv/bin/activate && mypy api
      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
      - name: Construire et vérifier la roue du paquet
        run: |
          . .venv/bin/activate
          python -m pip install build twine
          mkdir -p src/sentiment_app/modele
          cp models/sentiment.joblib src/sentiment_app/modele/
          python -m build
          twine check dist/*
          python -m pip install --no-deps dist/sentiment_app-1.0.1-py3-none-any.whl
          VERIFICATION_LIVRABLE=1 pytest -q tests/test_paquet.py
          SENTIMENT_BACKEND=package pytest -q tests/test_interface.py::test_backend_paquet_fonctionne_sans_api
